# Test de bout en bout sur un émulateur Android : construit l'app (architecture x86_64 pour l'émulateur), l'installe, puis
# pilote l'interface comme un utilisateur (GO, volet de notifications, autre écran, écran verrouillé par un code PIN, Doze forcé,
# fin de série, arrêt) en vérifiant les notifications avec `adb` (voir scripts/e2e-android.sh).
# Lancer à la main : Actions → « Test Android (émulateur) » → Run workflow (la branche à tester = celle choisie).
# Les captures d'écran et les relevés (dumpsys, logcat) sont joints au run (artefact `e2e-android`).
name: Test Android (émulateur)

on:
  # Tant que ce fichier n'est pas sur la branche par défaut, GitHub refuse de le lancer à la main : on le lance à chaque envoi
  # sur la branche de travail (à retirer à la fusion dans main : il reste alors le lancement à la main).
  push:
    branches: [claude/blissful-fermat-i2v7ov]
  workflow_dispatch:
    inputs:
      api:
        description: "Version d'Android de l'émulateur (34 = Android 14, 35, 36 = Android 16)"
        default: '34'
        type: choice
        options: ['34', '35', '36']

permissions:
  contents: write # seulement pour publier les résultats du test sur la branche e2e-results

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Générer le projet Android natif
        run: npx expo prebuild --platform android --no-install
      # Même allègement que l'APK de livraison, mais pour l'architecture de l'émulateur (x86_64).
      - name: Préparer la compilation pour l'émulateur
        run: |
          set -eu
          f=android/gradle.properties
          sed -i -e 's/^reactNativeArchitectures=.*/reactNativeArchitectures=x86_64/' \
                 -e 's/^expo.gif.enabled=.*/expo.gif.enabled=false/' \
                 -e 's/^expo.webp.enabled=.*/expo.webp.enabled=false/' \
                 -e 's/^EX_DEV_CLIENT_NETWORK_INSPECTOR=.*/EX_DEV_CLIENT_NETWORK_INSPECTOR=false/' "$f"
          grep -E '^(reactNativeArchitectures|expo.gif.enabled|expo.webp.enabled)=' "$f"
      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Activer l'accélération matérielle (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test sur l'émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api || '34' }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/e2e-android.sh android/app/build/outputs/apk/release/app-release.apk e2e-out
      - name: Résumé du test
        if: always()
        run: |
          cat e2e-out/summary.txt || true
          echo "----- notification n° 4242 juste après GO"; sed -n 1,60p e2e-out/after-go-id4242.txt || true
      # Captures et relevés lisibles sans télécharger l'artefact : branche e2e-results (écrasée à chaque test).
      - name: Publier les résultats (branche e2e-results)
        if: always()
        run: |
          cd e2e-out
          git init -q -b e2e-results
          git config user.name "e2e"
          git config user.email "e2e@users.noreply.github.com"
          git add -A
          git commit -q -m "Résultats du test émulateur ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" e2e-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-android
          path: e2e-out/
          if-no-files-found: warn
